name: Release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public commit to build
        required: true
        type: string
      tag:
        description: Candidate tag matching package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      - run: node scripts/bootstrap.mjs --ci
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs verify
      - run: node scripts/build-release-artifact.mjs --output "${{ runner.temp }}/candidate" --tag "${{ inputs.tag }}" --expected-sha "${{ inputs.commit }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitmog-release-candidate-${{ inputs.commit }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14
