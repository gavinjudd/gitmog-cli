name: Release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact public commit to build
        required: true
        type: string
      tag:
        description: Candidate tag matching package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          check-latest: false
      - run: node scripts/bootstrap.mjs --ci
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs verify
      - run: node scripts/build-release-artifact.mjs --output "${{ runner.temp }}/candidate" --tag "${{ inputs.tag }}" --expected-sha "${{ inputs.commit }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitmog-release-candidate-${{ inputs.commit }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14
