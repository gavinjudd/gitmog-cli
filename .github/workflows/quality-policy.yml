name: Quality policy

on:
  pull_request:
    paths:
      - "quality/**"
      - "docs/QUALITY_VALIDATION.md"
      - "docs/QUALITY_JUDGE.md"
      - "scripts/quality-policy-check.mjs"
      - "scripts/quality-fixtures.mjs"
  push:
    branches: [main]
    paths:
      - "quality/**"
      - "docs/QUALITY_VALIDATION.md"
      - "docs/QUALITY_JUDGE.md"
      - "scripts/quality-policy-check.mjs"
      - "scripts/quality-fixtures.mjs"

permissions:
  contents: read

jobs:
  policy:
    name: quality policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      - run: node scripts/bootstrap.mjs --ci
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs quality:fixtures
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs quality:policy:check
