name: Quality policy

on:
  pull_request:
    paths:
      - "quality/**"
      - "docs/QUALITY_VALIDATION.md"
      - "docs/QUALITY_JUDGE.md"
      - "scripts/quality-policy-check.mjs"
      - "scripts/quality-fixtures.mjs"
  push:
    branches: [main]
    paths:
      - "quality/**"
      - "docs/QUALITY_VALIDATION.md"
      - "docs/QUALITY_JUDGE.md"
      - "scripts/quality-policy-check.mjs"
      - "scripts/quality-fixtures.mjs"

permissions:
  contents: read

jobs:
  policy:
    name: quality policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          check-latest: false
          package-manager-cache: false
      - run: node scripts/bootstrap.mjs --ci
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs quality:fixtures
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs quality:policy:check
