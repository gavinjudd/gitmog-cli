name: Calibration contracts

on:
  pull_request:
    paths:
      - "calibration/**"
      - "docs/CALIBRATION.md"
      - "docs/QUALITY_JUDGE.md"
      - "scripts/calibration-check.mjs"
      - "scripts/quality-fixtures.mjs"
  push:
    branches: [main]
    paths:
      - "calibration/**"
      - "docs/CALIBRATION.md"
      - "docs/QUALITY_JUDGE.md"
      - "scripts/calibration-check.mjs"
      - "scripts/quality-fixtures.mjs"

permissions:
  contents: read

jobs:
  calibration:
    name: calibration contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          check-latest: false
      - run: node scripts/bootstrap.mjs --ci
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs quality:fixtures
      - run: node .gitmog/tooling/pnpm/node_modules/pnpm/bin/pnpm.cjs quality:calibration:check
