name: Quality Judge false positive
description: Submit a reduced synthetic fixture for a supported metric that fired incorrectly.
title: "[Quality false positive]: "
labels: ["type:false-positive", "area:quality-judge", "status:needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: "A bad metric is different from missing coverage. Submit the smallest invented TypeScript or JavaScript fixture that reproduces it. Public immutable evidence is optional context; never copy target source or include credentials or private source."
  - type: input
    id: reference
    attributes:
      {
        label: Public repository and exact commit (optional context),
        description: Do not paste source from the repository.,
      }
  - type: input
    id: path
    attributes:
      {
        label: Safe path and receipt ID (optional context),
        description: Use the synthetic path below when no public result is needed.,
      }
  - type: dropdown
    id: parser
    attributes: { label: Supported parser lane, options: ["TypeScript", "JavaScript"] }
    validations: { required: true }
  - type: textarea
    id: metric
    attributes:
      {
        label: Incorrect metric,
        description: "Explain applicability, observed bounded value, and expected finding without source excerpts.",
      }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      {
        label: Reduced synthetic fixture,
        description: Use invented identifiers and include only the minimum safe source needed to reproduce the metric.,
        render: text,
      }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected engineering-validation assertion }
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I included no credential, private source, or raw target source.
          required: true
        - label: The reproduction is reduced synthetic source that may be retained in the MIT-licensed test suite.
          required: true
