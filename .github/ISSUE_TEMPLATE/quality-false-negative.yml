name: Quality Judge false negative
description: Submit a reduced synthetic fixture for a supported applicable pattern that was missed.
title: "[Quality false negative]: "
labels: ["type:false-negative", "area:quality-judge", "status:needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: "First distinguish a missed supported metric from missing coverage or unsupported syntax. Submit the smallest invented fixture that reproduces the miss. Never post credentials, private source, or raw target source."
  - type: input
    id: reference
    attributes:
      {
        label: Public repository and exact commit (optional context),
        description: Do not paste source from the repository.,
      }
  - type: input
    id: path
    attributes:
      {
        label: Safe path and existing receipt or limitation ID (optional context),
        description: Use the synthetic path below when no public result is needed.,
      }
  - type: dropdown
    id: parser
    attributes:
      {
        label: Language and parser lane,
        options: ["TypeScript", "JavaScript", "Unsupported or missing coverage"],
      }
    validations: { required: true }
  - type: dropdown
    id: classification
    attributes:
      {
        label: Report type,
        options:
          [
            "Supported metric missed",
            "Coverage missing",
            "Unsupported syntax",
            "Attribution missing",
          ],
      }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      {
        label: Reduced synthetic fixture,
        description: Use invented identifiers and include only the minimum safe source needed to reproduce the miss.,
        render: text,
      }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected engineering-validation assertion }
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I included no credential, private source, or raw target source.
          required: true
        - label: The reproduction is reduced synthetic source that may be retained in the MIT-licensed test suite.
          required: true
